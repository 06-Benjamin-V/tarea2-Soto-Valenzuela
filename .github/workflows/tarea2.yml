name: Tarea 2 - CI/CD

# Desafio 4: jobs test -> build -> publish, en ese orden.
on:
  push:
    branches: [main, develop, 'feature/**', 'docker', 'pipeline']
  pull_request:
    branches: [main, develop]

# Necesario para publicar la imagen en GHCR.
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/06-benjamin-v/tarea2-soto-valenzuela
jobs:
  # ---------------- 1) TEST ----------------
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Ejecutar pruebas
        run: mvn -B --no-transfer-progress test

  # ---------------- 2) BUILD ----------------
  # Construye la imagen con docker build. No compila el proyecto antes:
  # el Dockerfile hace el build del JAR dentro de la propia imagen.
  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -f dockerfile --tag "$IMAGE_NAME:test" .

  # ---------------- 3) PUBLISH ----------------
  # Solo en push a main. Publica en GHCR (publica) con los tags latest y SHA corto.
  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar sesion en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular SHA corto
        id: vars
        run: echo "sha_corto=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_corto }}
